# Cloud images boot from virtio-blk and reach the network over virtio-net.
# dracut resolves module dependencies against the RUNNING kernel's modules.dep,
# so a cross-version rebuild (installing linux7.2 while linux6.12 is live) can
# omit drivers that only became modules in the new branch. On 7.2.15 virtio_net
# moved to drivers/net/virtio_net.ko and did not land in the initramfs. Keep the
# whole virtio stack explicit so this never bites at boot.
add_drivers+=" virtio_pci virtio_blk virtio_scsi virtio_net virtio_ring "
