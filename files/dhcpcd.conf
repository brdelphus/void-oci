# OCI (22/ago/2026): o DHCP entrega o IP e as rotas via opção 121
# (classless static routes) SEM incluir a rota default. O dhcpcd respeita o
# RFC 3442 e ignora a opção router quando a 121 existe — sem default, sem
# saída de internet. `nooption` remove a 121 da mensagem ANTES do
# processamento (a keyword `ignore` não existe no dhcpcd.conf — bug de 22/ago
# que não surtiu efeito) → o dhcpcd volta a usar a opção router (opção 3,
# que o OCI entrega) → rota default via o gateway do DHCP. Nada hard-coded.
nooption classless_static_routes
